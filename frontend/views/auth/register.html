
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Centro Salud</title>
    <!-- Vinculamos tu archivo CSS general -->
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

    <div class="auth-layout">
        <!-- Panel Izquierdo Azul (Branding) -->
        <div class="auth-left">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold;">CS</div>
                <div>
                    <h1 style="font-size: 1.125rem; font-weight: 700; line-height: 1;">Centro Salud</h1>
                    <p style="font-size: 0.75rem; color: rgba(255,255,255,0.8);">Sistema Médico</p>
                </div>
            </div>
            
            <div>
                <h2 style="font-size: 2.5rem; font-weight: 700; line-height: 1.2; margin-bottom: 1rem;">Tu salud,<br>nuestra prioridad.</h2>
                <p style="font-size: 1rem; color: rgba(255,255,255,0.8); max-width: 300px;">Gestiona tus citas médicas, recibe recordatorios y mantén tu historial siempre accesible.</p>
            </div>
        </div>

        <!-- Panel Derecho Blanco (Formulario) -->
        <div class="auth-right">
            <div class="auth-form-container">
                <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem;">Crear cuenta</h2>
                <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem;">Registrarse para gestionar tus citas</p>

                <div id="error-message" style="display: none; background: var(--danger-bg); color: var(--danger-text); padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px;"></div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="name">NOMBRE COMPLETO *</label>
                        <input type="name" id="name" placeholder="Ana Garcia Pérez" required>
                    </div>
                    
                    <div class="form-group">
                        <div class="form-group">
                            <label for="dni">DNI *</label>
                            <input type="dni" id="dni" placeholder="12345678" required>
                        </div>
                        <div class="form-group">
                            <label for="tel">TELÉFONO *</label>
                            <input type="tel" id="tel" placeholder="987-654-321" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">CORREO ELECTRONICO *</label>
                        <input type="email" id="email" placeholder="tu@correo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">CONTRASEÑA *</label>
                        <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
                    </div>

                    <button type="submit" class="btn-primary">Crear cuenta</button>
                </form>

                <p style="font-size: 0.875rem; text-align: center; color: var(--text-muted); margin-top: 1.5rem;">
                    ¿Ya tienes una cuenta? <a href="login.html" style="color: var(--primary); font-weight: 500; text-decoration: none;">Iniciar Sesión</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Vinculamos tu archivo JS general -->
    <script src="../../assets/js/main.js"></script>
</body>
</html>
