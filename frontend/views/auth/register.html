<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse - Centro Salud</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

  <div class="auth-layout">
    <div class="auth-left">
      <div class="auth-brand">
        <div class="brand-logo" aria-hidden="true">CS</div>
        <div>
          <h1 class="brand-name">Centro Salud</h1>
          <p class="brand-subtitle">Sistema Médico</p>
        </div>
      </div>

      <div>
        <h2 class="auth-hero-title">Tu salud,<br>nuestra prioridad.</h2>
        <p class="auth-hero-text">Gestiona tus citas médicas, recibe recordatorios y mantén tu historial siempre accesible.</p>
      </div>
    </div>

    <div class="auth-right">
      <div class="auth-form-container">
        <div class="auth-mobile-brand">
          <div class="brand-logo" aria-hidden="true">CS</div>
          <div>
            <p class="brand-name">Centro Salud</p>
            <p class="brand-subtitle">Sistema Médico</p>
          </div>
        </div>

        <h2 class="auth-form-title">Crear cuenta</h2>
        <p class="auth-form-subtitle">Regístrate para gestionar tus citas</p>

        <div id="error-message" class="alert alert--danger" role="alert" style="display: none;"></div>

        <form id="register-form">
          <div class="form-group">
            <label for="name">Nombre completo *</label>
            <input type="text" id="name" placeholder="Ana García Pérez" autocomplete="name" required>
          </div>

          <div class="form-grid form-grid--2">
            <div class="form-group">
              <label for="dni">DNI *</label>
              <input type="text" id="dni" placeholder="12345678" inputmode="numeric" required>
            </div>
            <div class="form-group">
              <label for="tel">Teléfono *</label>
              <input type="tel" id="tel" placeholder="987-654-321" autocomplete="tel" required>
            </div>
          </div>

          <div class="form-group">
            <label for="email">Correo electrónico *</label>
            <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email" required>
          </div>

          <div class="form-group">
            <label for="password">Contraseña *</label>
            <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
          </div>

          <button type="submit" class="btn-primary btn-block">Crear cuenta</button>
        </form>

        <p class="auth-footer-text">
          ¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../../assets/js/main.js"></script>
</body>
</html>
